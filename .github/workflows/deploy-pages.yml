name: Deploy NOOR AI Preview to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - "preview/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Assemble static preview
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/preview
          cp index.html _site/index.html
          cp preview/teacher-dashboard-preview.html _site/preview/teacher-dashboard-preview.html
          cp preview/student-dashboard-preview.html _site/preview/student-dashboard-preview.html
          cat > _site/DEPLOYMENT-NOTE.txt <<'EOF'
          NOOR AI is currently a visual prototype. Role switching is for preview only.
          This hosted version does not provide production authentication or live database persistence.
          Do not use real student or parent information.
          EOF

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy NOOR AI preview
        id: deployment
        uses: actions/deploy-pages@v4
