name: Deploy NOOR AI with Sound Engine

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: noor-ai-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Enable and configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Assemble only the public website files
        run: |
          mkdir -p _site/sounds
          # Publish every module actually referenced by the current index.html.
          # Previously omitted modules caused the live site to keep showing the old Teacher UI.
          # Stage every root-level website module. The old hand-maintained
          # list omitted new modules and prevented GitHub Pages deployment.
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          root, site = Path("."), Path("_site")
          public_extensions = {".html", ".js", ".css", ".svg", ".png", ".jpg", ".jpeg", ".webp", ".ico", ".woff", ".woff2", ".webmanifest"}
          assets = sorted(p for p in root.iterdir() if p.is_file() and p.suffix.lower() in public_extensions)
          for asset in assets:
              shutil.copy2(asset, site / asset.name)
          print("Public website root files staged:", len(assets))
          PY
          cp -R sounds/. _site/sounds/
          mkdir -p _site/preview
          cp preview/principal-dashboard-preview.html _site/preview/
          touch _site/.nojekyll
          # Fail deployment BEFORE publishing if a local src/href asset is missing.
          python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path("_site/index.html").read_text(encoding="utf-8")
          files = sorted({m.group(1).split("?", 1)[0].split("#", 1)[0].removeprefix("./")
              for m in re.finditer(r'(?:src|href)=["\'](\./[^"\']+)["\']', html)})
          missing = [f for f in files if not (Path("_site") / f).is_file()]
          print("GitHub Pages local assets verified:", len(files))
          if missing:
              raise SystemExit("Missing required public files: " + ", ".join(missing))
          PY

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          name: github-pages-${{ github.run_attempt }}

      - name: Wait for the uploaded Pages artifact to be visible
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            found=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --jq '.artifacts | any(.name == "github-pages-${{ github.run_attempt }}")')
            if [ "$found" = "true" ]; then exit 0; fi
            sleep 5
          done
          echo "Pages artifact metadata is not available yet. Retry this job."
          exit 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

      - name: Install headless browser
        run: |
          npm init -y
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Verify public application shell controls
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: node scripts/app-shell-smoke.mjs

      - name: Verify desktop and mobile Teacher Dashboard with isolated mock school data
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: node scripts/teacher-dashboard-smoke.mjs

      - name: Verify account appearance themes
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: node scripts/theme-smoke.mjs

      - name: Verify the deployed sound engine
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: node scripts/sound-smoke.mjs

      - name: Verify colourful principal dashboard
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: node scripts/principal-studio-smoke.mjs
